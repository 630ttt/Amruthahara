<!doctype html>
<html lang="en">
  <head>
    <!-- ========================================================= -->
    <!-- BASIC DOCUMENT SETTINGS -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    />

    />

    <meta
      name="author"

    />

    <meta
      name="publisher"
      content="Amruthahara"
    />

    <meta
      name="copyright"
      content="Amruthahara"
    />

    <meta
      name="language"
      content="English"

    <meta

    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"

    <meta

      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- ========================================================= -->
    <!-- CANONICAL URL -->
    <!-- ========================================================= -->

    <link
      rel="canonical"
      href="https://www.amruthahara.com/"
    />

    <!-- ========================================================= -->
    <!-- BRAND / THEME -->
    <!-- ========================================================= -->

    <meta
      name="theme-color"
      content="#173F2A"
    />

    <meta
      name="color-scheme"
      content="light"
    />

    <meta
      name="application-name"
      content="Amruthahara"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Amruthahara"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="format-detection"
      content="telephone=no"
    />

    <!-- ========================================================= -->
    <!-- FAVICON -->
    <!-- ========================================================= -->

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <link
      rel="manifest"
      href="/site.webmanifest"
    />

    <!-- ========================================================= -->
    <!-- PERFORMANCE / FONT CONNECTIONS -->
    <!-- ========================================================= -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"

    <link
      rel="dns-prefetch"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="dns-prefetch"
      href="https://fonts.gstatic.com"
    />

      property="og:locale"

      name="twitter:title"
      content="Amruthahara | Premium Organic & Natural Food Products"
    />

    <meta
      name="twitter:description"
      content="Shop premium organic and natural food products from Amruthahara. Fresh, authentic and quality products for your everyday life."

    <meta
      name="twitter:image"
      content="https://www.amruthahara.com/og-image.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="Amruthahara Premium Organic Food Products"
    />

    <!-- SEARCH ENGINE / WEBSITE INFORMATION -->

      name="referrer"
      content="strict-origin-when-cross-origin"
    />

    <meta
      name="rating"
      content="general"
    />

    <meta
      name="distribution"
      content="global"
    />

    <meta
      name="coverage"
      content="India"
    />

        "url": "https://www.amruthahara.com/",

        ]
      }

    <!-- WEBSITE STRUCTURED DATA -->

        "url": "https://www.amruthahara.com/",
        "description": "Premium organic and natural food products from Amruthahara.",

          },
          "query-input": "required name=search_term_string"

      }

        "url": "https://www.amruthahara.com/",
        "logo": "https://www.amruthahara.com/logo.png",
